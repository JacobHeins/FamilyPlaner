# Datasource — local dev defaults
spring.datasource.url=jdbc:postgresql://localhost:5432/familyplaner
spring.datasource.username=admin
spring.datasource.password=secret

# Hibernate — Hibernate manages schema changes automatically in dev
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable Flyway in dev — Hibernate handles the schema
spring.flyway.enabled=false
